name: build profile

on:
  # refresh the stats, "pushed 2d ago" labels and the snake every 6 hours
  schedule:
    - cron: "0 */6 * * *"
  # run it by hand from the Actions tab
  workflow_dispatch:
  # rebuild whenever the README, generator or config changes
  push:
    branches:
      - main

# only needs to push the generated images to the `output` branch
permissions:
  contents: write

concurrency:
  group: build-profile
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # hero, project rows, pg_stat panel, link buttons, footer -> dist/profile/
      # and re-sync the README projects block with the current pins
      - name: generate profile SVGs
        run: node scripts/build.mjs --out dist/profile --readme README.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}

      # commits to main only when the pinned repos changed
      # (pushes made with GITHUB_TOKEN don't re-trigger this workflow)
      - name: commit README if the pins changed
        run: |
          if git diff --quiet -- README.md; then
            echo "README already matches the pins"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Sync README projects with pinned repos" -- README.md
            git push
          fi

      # snake eating the contribution graph -> dist/ (same paths as before)
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # one push of everything, so the snake and profile images never overwrite each other
      - name: push dist/ to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
